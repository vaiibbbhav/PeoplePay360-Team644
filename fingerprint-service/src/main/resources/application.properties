server.port=8085
spring.application.name=fingerprint-backend

# Master 256-bit AES-GCM Key for biometric template protection
# Sourced securely from environment variable FINGERPRINT_ENCRYPTION_KEY (or .env file)
fingerprint.encryption.key=${FINGERPRINT_ENCRYPTION_KEY:}

# Path to the JSON file where fingerprint templates are stored
fingerprint.storage.file=data/templates.json

# Maximum upload size for fingerprint images / base64 payloads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
